
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.wrap { padding: 8px 0; font-family: var(--font-sans); }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-btn { padding: 6px 14px; font-size: 12px; border: 0.5px solid var(--color-border-secondary); border-radius: 20px; background: var(--color-background-primary); color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s; }
.filter-btn.active { border-color: #534AB7; background: #EEEDFE; color: #3C3489; }
.search-wrap { margin-bottom: 14px; }
.search-wrap input { width: 100%; padding: 8px 12px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); outline: none; }
.cards-grid { display: grid; gap: 10px; }
.uji-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; cursor: pointer; transition: border-color 0.15s; }
.uji-card:hover { border-color: var(--color-border-secondary); }
.uji-card.open { border-color: #534AB7; }
.card-header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.card-icon { min-width: 36px; height: 36px; border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.icon-nominal { background: #FAECE7; }
.icon-ordinal { background: #FAEEDA; }
.icon-interval { background: #EEEDFE; }
.card-meta { flex: 1; min-width: 0; }
.card-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; }
.t-nominal { background: #FAECE7; color: #712B13; }
.t-ordinal { background: #FAEEDA; color: #633806; }
.t-interval { background: #EEEDFE; color: #3C3489; }
.t-parametrik { background: #E6F1FB; color: #0C447C; }
.t-nonpara { background: #E1F5EE; color: #085041; }
.chevron { font-size: 14px; color: var(--color-text-tertiary); transition: transform 0.2s; }
.uji-card.open .chevron { transform: rotate(180deg); }
.card-body { display: none; padding: 0 14px 14px; border-top: 0.5px solid var(--color-border-tertiary); margin-top: 0; }
.uji-card.open .card-body { display: block; }
.body-section { margin-top: 12px; }
.body-label { font-size: 10px; font-weight: 500; color: #534AB7; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
.body-text { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; }
.body-text strong { color: var(--color-text-primary); font-weight: 500; }
.example-box { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; margin-top: 6px; font-size: 12px; color: var(--color-text-secondary); line-height: 1.5; border-left: 2px solid #534AB7; }
.no-result { text-align: center; padding: 32px; color: var(--color-text-tertiary); font-size: 13px; }
.count-info { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 10px; }
</style>

<h2 class="sr-only">Penjelasan lengkap setiap alat uji statistik sosial berdasarkan skala data dan tujuan analisis</h2>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Cari nama uji... (contoh: Anova, Spearman, t-test)" oninput="filterCards()" />
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('semua',this)">Semua</button>
    <button class="filter-btn" onclick="setFilter('nominal',this)">Nominal</button>
    <button class="filter-btn" onclick="setFilter('ordinal',this)">Ordinal</button>
    <button class="filter-btn" onclick="setFilter('interval',this)">Interval/Rasio</button>
    <button class="filter-btn" onclick="setFilter('parametrik',this)">Parametrik</button>
    <button class="filter-btn" onclick="setFilter('nonpara',this)">Non-Parametrik</button>
  </div>
  <div class="count-info" id="countInfo"></div>
  <div class="cards-grid" id="cardsGrid"></div>
</div>

let activeFilter = 'semua';
let searchQuery = '';

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function filterCards() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  const filtered = data.filter(d => {
    const matchFilter =
      activeFilter === 'semua' ||
      (activeFilter === 'nominal' && d.skala.includes('nominal')) ||
      (activeFilter === 'ordinal' && d.skala.includes('ordinal')) ||
      (activeFilter === 'interval' && d.skala.includes('interval')) ||
      (activeFilter === 'parametrik' && d.jenis.includes('parametrik')) ||
      (activeFilter === 'nonpara' && d.jenis.includes('nonpara'));
    const matchSearch = !searchQuery || d.name.toLowerCase().includes(searchQuery) || d.deskripsi.toLowerCase().includes(searchQuery);
    return matchFilter && matchSearch;
  });

  document.getElementById('countInfo').textContent = filtered.length + ' alat uji ditampilkan';

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-result">Tidak ada hasil ditemukan. Coba kata kunci lain.</div>';
    return;
  }

  grid.innerHTML = filtered.map((d, i) => {
    const skalaTags = d.skala.map(s => {
      if (s === 'nominal') return '<span class="tag t-nominal">Nominal</span>';
      if (s === 'ordinal') return '<span class="tag t-ordinal">Ordinal</span>';
      return '<span class="tag t-interval">Interval/Rasio</span>';
    }).join('');
    const jenisTags = d.jenis.map(j => j === 'parametrik'
      ? '<span class="tag t-parametrik">Parametrik</span>'
      : '<span class="tag t-nonpara">Non-Parametrik</span>'
    ).join('');
    return `<div class="uji-card" id="card-${i}" onclick="toggleCard(${i})">
      <div class="card-header">
        <div class="card-icon ${d.icon}">${d.emoji}</div>
        <div class="card-meta">
          <div class="card-name">${d.name}</div>
          <div class="card-tags">${skalaTags}${jenisTags}</div>
        </div>
        <div class="chevron">&#8964;</div>
      </div>
      <div class="card-body">
        <div class="body-section">
          <div class="body-label">Pengertian</div>
          <div class="body-text">${d.deskripsi}</div>
        </div>
        <div class="body-section">
          <div class="body-label">Kapan digunakan</div>
          <div class="body-text">${d.kapan}</div>
        </div>
        <div class="body-section">
          <div class="body-label">Syarat penggunaan</div>
          <div class="body-text">${d.syarat}</div>
        </div>
        <div class="body-section">
          <div class="body-label">Contoh kasus</div>
          <div class="example-box">${d.contoh}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(i) {
  const card = document.getElementById('card-' + i);
  card.classList.toggle('open');
}

renderCards();
</script>
